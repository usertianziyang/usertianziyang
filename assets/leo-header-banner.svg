<svg width="960" height="320" viewBox="0 0 960 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#020617"/>
    </radialGradient>
    
    <linearGradient id="neon-cyan-purple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>

    <linearGradient id="neon-purple-cyan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#22D3EE" stop-opacity="0.2"/>
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.5" opacity="0.4"/>
    </pattern>

    <filter id="glow-strong" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="glow-subtle" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base & Grid -->
  <rect width="960" height="320" rx="16" fill="url(#bg-grad)"/>
  <rect width="960" height="320" rx="16" fill="url(#grid)"/>
  
  <!-- Outer Border -->
  <rect x="1" y="1" width="958" height="318" rx="15" fill="none" stroke="#1E293B" stroke-width="2"/>

  <!-- Right Side: Abstract Geometry -->
  <g opacity="0.8">
    <!-- Base large circle -->
    <circle cx="780" cy="160" r="140" fill="none" stroke="#1E293B" stroke-width="1.5"/>
    <circle cx="780" cy="160" r="100" fill="none" stroke="#334155" stroke-width="1" stroke-dasharray="4 8"/>
    
    <!-- Glowing dashed orbit -->
    <circle cx="780" cy="160" r="60" fill="none" stroke="url(#neon-cyan-purple)" stroke-width="2.5" stroke-dasharray="15 30" filter="url(#glow-strong)"/>
    
    <!-- Solid inner core ring -->
    <circle cx="780" cy="160" r="20" fill="none" stroke="#22D3EE" stroke-width="1.5" filter="url(#glow-subtle)"/>
    
    <!-- Angled tech lines -->
    <path d="M 600 320 L 720 200 L 960 200" fill="none" stroke="url(#neon-cyan-purple)" stroke-width="1.5" opacity="0.6"/>
    <path d="M 500 0 L 720 220" fill="none" stroke="#7C3AED" stroke-width="1" opacity="0.3"/>
    <path d="M 880 0 L 780 100 L 780 160" fill="none" stroke="#22D3EE" stroke-width="1" opacity="0.4"/>
    
    <!-- Floating accent dots -->
    <circle cx="680" cy="120" r="3" fill="#22D3EE" filter="url(#glow-subtle)"/>
    <circle cx="860" cy="240" r="2" fill="#7C3AED" filter="url(#glow-subtle)"/>
    <circle cx="720" cy="200" r="4" fill="#FFFFFF"/>
    <circle cx="780" cy="100" r="2" fill="#FFFFFF"/>
  </g>

  <!-- Left Side: Typography -->
  <!-- Monospace tag -->
  <text x="60" y="80" font-family="Fira Code, JetBrains Mono, monospace" font-size="12" font-weight="500" fill="#64748B" letter-spacing="1">
    >_ SYS.INIT // VIBECODING_PROTOCOL_ACTIVE
  </text>
  
  <!-- Main Name Title -->
  <text x="56" y="180" font-family="Inter, system-ui, sans-serif" font-size="76" font-weight="900" fill="#FFFFFF" letter-spacing="8">
    LEO.
  </text>

  <!-- Subtitle -->
  <text x="60" y="225" font-family="Inter, system-ui, sans-serif" font-size="15" font-weight="700" fill="url(#neon-cyan-purple)" letter-spacing="3">
    AI WORKFLOW ARCHITECT / AUTOMATION EXPERT
  </text>

  <!-- Divider Line -->
  <line x1="60" y1="250" x2="180" y2="250" stroke="#7C3AED" stroke-width="3" filter="url(#glow-subtle)"/>
  <line x1="180" y1="250" x2="420" y2="250" stroke="#1E293B" stroke-width="3"/>

  <!-- Footer tiny description -->
  <text x="60" y="280" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="400" fill="#94A3B8">
    Turning abstract ideas into autonomous workflows with Agentic AI, BI, and RPA.
  </text>
</svg>
