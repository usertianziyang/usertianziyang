<svg width="960" height="220" viewBox="0 0 960 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="placeholder-title placeholder-desc">
  <title id="placeholder-title">Projects Showcase Coming Soon</title>
  <desc id="placeholder-desc">A premium cyber-tech placeholder illustration showing that Leo's project showcase is under preparation.</desc>

  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0" y1="0" x2="960" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#020617"/>
      <stop offset="0.5" stop-color="#070A13"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>

    <!-- Neon Border Gradient -->
    <linearGradient id="neon-glow-grad" x1="0" y1="0" x2="960" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#1E293B" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0.6"/>
    </linearGradient>

    <!-- Dot Grid Pattern -->
    <pattern id="dot-pattern" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.8" fill="#475569" opacity="0.3"/>
    </pattern>

    <!-- Glow Filters -->
    <filter id="neon-glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Panel -->
  <rect width="960" height="220" rx="16" fill="url(#bg-grad)"/>
  <rect width="960" height="220" rx="16" fill="url(#dot-pattern)"/>
  
  <!-- Subtle Border -->
  <rect x="1.5" y="1.5" width="957" height="217" rx="14.5" stroke="url(#neon-glow-grad)" stroke-width="1.5"/>

  <!-- Centered Interactive Schematic Graphic -->
  <g transform="translate(0, -10)">
    <!-- Central Node -->
    <circle cx="480" cy="80" r="14" fill="#0A0F1E" stroke="#22D3EE" stroke-width="2" filter="url(#neon-glow-filter)"/>
    <circle cx="480" cy="80" r="6" fill="#22D3EE"/>

    <!-- Left Branch Node -->
    <line x1="480" y1="80" x2="400" y2="105" stroke="#7C3AED" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="400" cy="105" r="8" fill="#0A0F1E" stroke="#7C3AED" stroke-width="1.5"/>
    <circle cx="400" cy="105" r="3.5" fill="#7C3AED"/>

    <!-- Right Branch Node -->
    <line x1="480" y1="80" x2="560" y2="105" stroke="#818CF8" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="560" cy="105" r="8" fill="#0A0F1E" stroke="#818CF8" stroke-width="1.5"/>
    <circle cx="560" cy="105" r="3.5" fill="#818CF8"/>

    <!-- Top Floating Nodes -->
    <line x1="480" y1="80" x2="480" y2="40" stroke="#64748B" stroke-width="1" opacity="0.5"/>
    <circle cx="480" cy="40" r="4" fill="#64748B" opacity="0.7"/>

    <line x1="400" y1="105" x2="360" y2="85" stroke="#64748B" stroke-width="1" opacity="0.3"/>
    <circle cx="360" cy="85" r="3" fill="#64748B" opacity="0.5"/>

    <line x1="560" y1="105" x2="600" y2="85" stroke="#64748B" stroke-width="1" opacity="0.3"/>
    <circle cx="600" cy="85" r="3" fill="#64748B" opacity="0.5"/>
  </g>

  <!-- Typography -->
  <!-- Main Title -->
  <text x="480" y="146" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="800" fill="#FFFFFF" letter-spacing="4">PROJECT ARCHIVE</text>
  
  <!-- Subtitle (Chinese) -->
  <text x="480" y="168" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#94A3B8">主页筹备中 // 更多实战经验与开源项目正在梳理中，敬请期待...</text>

  <!-- Comment Styling (Futuristic Code Vibe) -->
  <text x="480" y="190" text-anchor="middle" font-family="Fira Code, JetBrains Mono, monospace" font-size="11" font-weight="500" fill="#67E8F9" opacity="0.6">/* AI Agent Workflows · BI Data Dashboards · RPA Auto-Runners · Next.js Prototypes */</text>

</svg>
